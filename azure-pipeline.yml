trigger:
  branches:
    include:
      - develop
      - main

pr:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.19.1'
    displayName: 'Utiliser Node.js 20.19.1'

  - checkout: self
    displayName: 'Checkout client-qcm-plus'

  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'specific'
      project: 'qcm-plus'
      definition: 7
      buildVersionToDownload: 'latest'
      artifactName: 'logicPackage'
      targetPath: '$(Pipeline.Workspace)/logic'
    displayName: 'Télécharger dernier artefact logic-qcm-plus'

  - script: |
      cd client-qcm-plus
      npm ci
      npm install $(Pipeline.Workspace)/logic/logic-qcm-plus-*.tgz
    displayName: 'Installer dépendances + logic-qcm-plus'

  - script: |
      cd client-qcm-plus
      npm run lint
      npm run format:check
      npm run build
    displayName: 'Build client-qcm-plus'
