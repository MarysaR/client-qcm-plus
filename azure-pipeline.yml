trigger:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Utiliser Node.js'

  - script: npm ci
    displayName: 'Installer les dépendances'

  - script: |
      cd logic-qcm-plus
      npm ci
      npm run build
    displayName: 'Build logic-qcm-plus'

  - script: |
      mkdir -p client-qcm-plus/vendor/logic-qcm-plus
      cp -R logic-qcm-plus/src client-qcm-plus/vendor/logic-qcm-plus/
    displayName: 'Copier src logic-qcm-plus vers vendor'

  - script: npm run lint
    displayName: 'Vérifier le lint'

  - script: npm run format:check
    displayName: 'Vérifier le formatage'

  - script: |
      cd client-qcm-plus
      npm ci
      npm run build
    displayName: 'Compiler le client'
