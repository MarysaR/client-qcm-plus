trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Installation de Node.js'

  - script: npm ci
    displayName: 'Installation des dépendances'

  - script: npm run lint
    displayName: 'Analyse statique avec ESLint'

  - script: npm run format -- --check
    displayName: 'Vérification du format avec Prettier'

  - script: npm run build
    displayName: 'Compilation TypeScript'

  - script: npm run test
    displayName: 'Exécution des tests avec Jest'
