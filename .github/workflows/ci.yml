name: CI

on:
  push:
    tags-ignore:
      - "**"
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout logic-qcm-plus
        uses: actions/checkout@v4
        with:
          repository: MarysaR/logic-qcm-plus
          path: logic-qcm-plus

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build logic
        run: |
          cd logic-qcm-plus
          npm ci
          npm run build
          npm pack

      - name: Upload logic package
        uses: actions/upload-artifact@v4
        with:
          name: logicPackage
          path: logic-qcm-plus/logic-qcm-plus-*.tgz

  client:
    runs-on: ubuntu-latest
    needs: logic
    steps:
      - name: Checkout client-qcm-plus
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download logic package
        uses: actions/download-artifact@v4
        with:
          name: logicPackage
          path: ./logic

      - name: Install dependencies
        run: |
          npm install ./logic/logic-qcm-plus-*.tgz
          npm install

      - name: Build client
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
